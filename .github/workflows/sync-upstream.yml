# sync-upstream.yml —— 构建多架构镜像（2026-09-24 起已停用上游同步）。
#
# 为什么停：原上游 Sliverkiss/workbuddy2api 已从 GitHub 删除（404），
# sync 步骤的 git fetch 直接失败（remote: Repository not found / exit 128），
# 每 6 小时的定时同步连续失败，并把同 workflow 里的 build 卡成 skipped。
#
# 现在的职责只剩：推送到 master / 手动触发 → 构建 linux/amd64 + linux/arm64
# 镜像推送到 ghcr.io/hachimicx/workbuddy2api。
#
# 以后若要重新跟随某个上游仓库：
#   1) 在 on: 下恢复 schedule（或继续用手动触发）
#   2) 把 prep job 里的「Resolve HEAD」步骤换回 fetch + merge 逻辑
#      （旧版实现见 git log -- .github/workflows/sync-upstream.yml）
#   3) UPSTREAM_REPO 指向仍然存在、仍在更新的仓库
#
# 为什么 build 和它同一个 workflow：用 GITHUB_TOKEN 推送产生的 push 事件不会触发其它
# workflow（GitHub 防递归），所以构建必须跟在同一个 workflow 里跑。
name: Build (upstream sync stopped)

on:
  workflow_dispatch:
    inputs:
      dispatch_build:
        description: '额外派发一次 build.yml（产出 amd64 离线 tar.gz）'
        required: false
        type: boolean
        default: false
  push:
    branches: [master]

# 本 workflow 自身串行（同一时刻只有一个构建在跑），避免两个 run 把 :latest 推成不同 commit。
concurrency:
  group: wb2api-sync-upstream
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # 手动派发 build.yml 需要 actions: write（缺这个权限会 403 Resource not accessible）。
  actions: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.head.outputs.changed }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Check out fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve HEAD (upstream sync disabled)
        id: head
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          {
            echo "changed=false"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "上游同步已停用（原上游 Sliverkiss/workbuddy2api 已删除），本次构建 commit ${SHA:0:7}"

      # GITHUB_TOKEN 推送的 commit 不会触发其它 workflow（防递归），手动派发是官方规则里
      # 唯一的例外，GITHUB_TOKEN + actions: write 即可，不需要 PAT。
      - name: Trigger Build & Publish (build.yml)
        if: inputs.dispatch_build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "已派发 build.yml（amd64 离线 tar.gz）"

      - name: Summary
        run: |
          {
            echo "### 构建（上游同步已停用）"
            echo ""
            echo "- 触发方式: \`${{ github.event_name }}\`"
            echo "- 构建 commit: \`${{ steps.head.outputs.sha }}\`"
            echo "- 说明: 原上游 Sliverkiss/workbuddy2api 已删除，定时同步已关闭；本 workflow 只构建镜像"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prep
    # 手动触发 / 推送到 master 都构建；仅当 schedule 且没有新代码时跳过（schedule 已停用，保留以便日后恢复）。
    if: needs.prep.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.sha }}

      - name: Create config.json for build
        run: cp config.example.json config.json

      # setup-qemu 必须在 setup-buildx 之前：buildx 多架构依赖 QEMU 跨平台模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像名必须全小写：github.repository 可能含大写，需转小写
      - name: Compute image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.prep.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
